name: clinic-booking-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports:
      - "${PROD_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${PROD_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-insight:
    image: redislabs/redisinsight:2.66
    container_name: redis-insight-prod
    ports:
      - "${PROD_INSIGHT_PORT:-8002}:5540"
    environment:
      REDIS_PORT: 6379
      REDIS_HOST: redis
    depends_on:
      - redis

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://clinic:clinic@db:5432/clinic
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-prod-change-me}
      JWT_EXPIRES_IN: 1d
    ports:
      - "${PROD_API_PORT:-3001}:3000"
    command: ["sh", "-c", "bun dist/database/migrate.js && bun run start:prod"]

volumes:
  pgdata:
