name: clinic-booking-prod

x-api: &api
  image: clinic-booking-api:prod
  build: .
  environment: &api-env
    NODE_ENV: production
    PORT: 3000
    DATABASE_URL: postgres://clinic:clinic@db:5432/clinic
    REDIS_HOST: redis
    REDIS_PORT: 6379
    JWT_SECRET: ${JWT_SECRET:-prod-change-me}
    JWT_EXPIRES_IN: 1d
  command: ["bun", "run", "start:prod"]
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    # migrate:
    #   condition: service_completed_successfully
  healthcheck:
    test:
      [
        "CMD",
        "bun",
        "-e",
        "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports:
      - "${PROD_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${PROD_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-insight:
    image: redislabs/redisinsight:2.66
    container_name: redis-insight-prod
    ports:
      - "${PROD_INSIGHT_PORT:-8002}:5540"
    environment:
      REDIS_PORT: 6379
      REDIS_HOST: redis
    depends_on:
      - redis

  # migrate:
  #   image: clinic-booking-api:prod
  #   build: .
  #   environment:
  #     <<: *api-env
  #   command: ["bun", "dist/db/migrate.js"]
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   restart: "no"

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2

  lb:
    image: nginx:1.27-alpine
    ports:
      - "${PROD_LB_PORT:-8080}:80"
    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

volumes:
  pgdata:
